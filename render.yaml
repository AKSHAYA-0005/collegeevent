# ==============================================================================
# Render Blueprint Specification - College Event Registration System
# ==============================================================================

services:
  - type: web
    name: college-event-registration
    env: java
    region: oregon
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -Dspring.profiles.active=h2 -Dserver.port=$PORT -jar target/event-registration-backend-1.0.0.jar
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: SPRING_PROFILES_ACTIVE
        value: h2
