# ===================================================================
# In-Memory H2 Profile for demo / lab exam without local MySQL
# Activate with: --spring.profiles.active=h2
# ===================================================================

server.port=8080

spring.datasource.url=jdbc:h2:mem:college_event_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Seed initial events
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
