# ===================================================================
# College Event Registration System - Spring Boot Configuration
# ===================================================================

# Application Server Port (dynamic for cloud platforms like Render)
server.port=${PORT:8080}

# Database Configuration (MySQL)
# Update username and password according to your local lab MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/college_event_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JSON Date Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Seed initial events from data.sql after Hibernate schema initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

